<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy for learn — Vocabulary Studio</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#20243a;--muted:#727991;--line:#e8eaf2;--brand:#5a55d6;--brand2:#eeedff;--green:#16866b;--red:#c84b62;--shadow:0 12px 35px #27234a0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:650;transition:.15s}button:hover{transform:translateY(-1px)}.primary{background:var(--brand);color:white}.secondary{background:var(--brand2);color:var(--brand)}.ghost{background:#f3f4f8;color:#555b72}.danger{background:#fff0f2;color:var(--red)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #5a55d61a}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}.field{margin-bottom:12px}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:10px;align-items:center;padding:0 8px;font-size:20px;font-weight:850;letter-spacing:-.7px}.brandmark{display:grid;place-items:center;background:var(--brand);color:white;width:36px;height:36px;border-radius:12px}.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:12px;background:transparent;color:#6a7087;text-align:left;padding:12px}.nav button.active{background:var(--brand2);color:var(--brand)}.nav .ico{width:20px;text-align:center}.side-note{margin-top:auto;background:#f8f7ff;border:1px solid #eeecff;padding:14px;border-radius:14px;font-size:12px;color:#6b6797}.main{min-width:0}.topbar{height:76px;background:#ffffffc9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}.search{max-width:400px;position:relative;flex:1}.search input{padding-left:38px;background:#f7f8fb}.search span{position:absolute;left:13px;top:9px;color:#858ba1}.profile{display:flex;align-items:center;gap:10px;font-weight:700}.avatar{width:36px;height:36px;border-radius:50%;background:#e7e5ff;color:var(--brand);display:grid;place-items:center}.content{padding:30px 34px;max-width:1450px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:1.3px;font-size:10px}.pagehead h1{font-size:28px;letter-spacing:-.8px;margin:4px 0}.sub{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .label{font-size:12px;color:var(--muted);font-weight:650}.stat .num{font-size:29px;font-weight:850;letter-spacing:-1px;margin-top:6px}.stat .iconbox{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--brand2);font-size:18px}.dashgrid{grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr)}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.cardhead h2{font-size:16px;margin:0}.muted{color:var(--muted)}.progress{height:8px;border-radius:9px;background:#eeeef6;overflow:hidden}.progress>span{display:block;height:100%;background:var(--brand);border-radius:9px}.skillrow{display:grid;grid-template-columns:100px 1fr 38px;align-items:center;gap:12px;margin:17px 0;font-size:13px}.skillrow .progress{height:7px}.streak{background:linear-gradient(130deg,#5a55d6,#827cf1);color:white;border:0}.streak .muted{color:#e3e1ff}.streak .big{font-size:26px;font-weight:850;margin:8px 0}.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#f0efff;color:#5a55d6;font-size:11px;font-weight:750}.pill.green{background:#e7f7f1;color:#138166}.pill.orange{background:#fff4e2;color:#a76808}.pill.red{background:#fff0f2;color:#bf3d55}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#f0f1f7;color:#666b82}.tabs button.active{background:var(--brand);color:white}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{width:auto;min-width:150px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;background:white;min-width:650px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{font-size:11px;color:var(--muted);background:#fafaff;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.word{font-size:15px;font-weight:800}.meaning{color:var(--muted);max-width:320px}.rowactions{display:flex;gap:6px}.rowactions button{padding:7px 9px;font-size:12px}.empty{text-align:center;padding:36px 18px;color:var(--muted)}.empty .emoji{font-size:32px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.span2{grid-column:span 2}.flash-wrap{max-width:720px;margin:0 auto}.flashcard{min-height:320px;border:1px solid #e4e1ff;background:linear-gradient(145deg,#fff,#f8f7ff);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;cursor:pointer;box-shadow:var(--shadow)}.flash-word{font-size:40px;font-weight:850;letter-spacing:-1px;margin:15px 0}.flash-meaning{font-size:19px;margin:8px 0}.flash-example{color:var(--muted);font-style:italic;max-width:520px}.flash-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.flash-controls button{min-width:110px}.hidden{display:none!important}.notice{border-radius:12px;padding:12px 14px;background:#f4f3ff;color:#5c58a2;font-size:13px;margin:12px 0}.success{background:#eaf8f2;color:#18775f}.error{background:#fff0f2;color:#b63b53}.modal-backdrop{position:fixed;inset:0;background:#15152d77;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:24px;box-shadow:0 25px 80px #0002}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:20px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.skill-card{display:flex;gap:14px;align-items:flex-start}.skill-icon{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:13px;background:var(--brand2);font-size:21px}.skill-card h3{margin:0 0 4px;font-size:15px}.skill-card p{margin:0 0 12px;color:var(--muted);font-size:13px}.question{font-size:23px;font-weight:800;margin:18px 0}.options{display:grid;gap:9px}.options button{text-align:left;background:#f6f6fb;border:1px solid var(--line);font-weight:600}.options button.correct{border-color:#39a98b;background:#e9f8f2}.options button.wrong{border-color:#d45a6c;background:#fff0f2}.resultbox{padding:18px;border-radius:14px;background:#f8f7ff;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;background:#24243b;color:white;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:340px}.small{font-size:12px}.footer-note{margin-top:18px;font-size:11px;color:var(--muted)}.mobile-menu{display:none}
@media(max-width:950px){.layout{grid-template-columns:76px 1fr}.sidebar{padding:20px 10px}.brand{padding:0;justify-content:center}.brandtext,.navlabel,.side-note{display:none}.nav button{justify-content:center;padding:13px 8px}.nav .ico{font-size:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashgrid{grid-template-columns:1fr}.content{padding:24px 20px}.topbar{padding:0 20px}}
@media(max-width:600px){.layout{display:block}.sidebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:64px;border-right:0;border-top:1px solid var(--line);padding:5px 8px;display:block}.brand{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{display:flex;flex-direction:column;gap:1px;padding:5px 7px;font-size:10px}.navlabel{display:block;font-size:9px}.nav .ico{font-size:16px}.topbar{height:64px;padding:0 14px}.profile .username{display:none}.content{padding:22px 14px 86px}.pagehead{display:block}.pagehead>.toolbar{margin-top:14px}.pagehead h1{font-size:24px}.stats{gap:10px}.card{padding:16px}.stat .num{font-size:24px}.stat .iconbox{width:34px;height:34px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar input,.toolbar select{width:100%}.flash-word{font-size:32px}.skillrow{grid-template-columns:80px 1fr 32px}.hide-mobile{display:none}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">H</div><span class="brandtext">Happy for learn</span></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">◫</span><span class="navlabel">Tổng quan</span></button>
    <button data-page="vocabulary"><span class="ico">▤</span><span class="navlabel">Từ vựng</span></button>
    <button data-page="learn"><span class="ico">✦</span><span class="navlabel">Flashcards</span></button>
    <button data-page="practice"><span class="ico">◉</span><span class="navlabel">4 kỹ năng</span></button>
    <button data-page="import"><span class="ico">⇧</span><span class="navlabel">Import</span></button>
  </nav>
  <div class="side-note"><strong>Học một chút mỗi ngày</strong><p>Ôn tập đều đặn giúp bạn đưa từ vựng vào trí nhớ dài hạn.</p></div>
</aside>
<main class="main">
<header class="topbar">
  <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Tìm từ vựng..." aria-label="Tìm từ vựng" /></div>
  <div class="profile"><div class="avatar">T</div><span class="username">My learning space</span></div>
</header>
<div class="content" id="app"></div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const SEED = [
 {id:1,word:"sustainable",pos:"adjective",meaning:"bền vững",translation:"bền vững",ipa:"/səˈsteɪnəbl/",example:"Governments should invest in sustainable public transport.",topic:"Environment",level:"B2",source:"Sample",notes:"",status:"NEW",correct:0,wrong:0,due:null},
 {id:2,word:"mitigate",pos:"verb",meaning:"làm giảm, giảm nhẹ tác động",translation:"giảm thiểu",ipa:"/ˈmɪtɪɡeɪt/",example:"Planting trees can help mitigate the effects of climate change.",topic:"Environment",level:"C1",source:"Sample",notes:"",status:"NEW",correct:0,wrong:0,due:null},
 {id:3,word:"overwhelmed",pos:"adjective",meaning:"quá tải, choáng ngợp",translation:"quá tải",ipa:"/ˌəʊvəˈwelmd/",example:"Many students feel overwhelmed before an important exam.",topic:"Education",level:"B2",source:"Sample",notes:"",status:"LEARNING",correct:1,wrong:1,due:null},
 {id:4,word:"emerging",pos:"adjective",meaning:"mới nổi, đang phát triển",translation:"mới nổi",ipa:"/ɪˈmɜːdʒɪŋ/",example:"Emerging technologies are changing the workplace.",topic:"Technology",level:"B2",source:"Sample",notes:"",status:"NEW",correct:0,wrong:0,due:null},
 {id:5,word:"allocate",pos:"verb",meaning:"phân bổ",translation:"phân bổ",ipa:"/ˈæləkeɪt/",example:"The government should allocate more funding to education.",topic:"Government",level:"C1",source:"Sample",notes:"",status:"NEW",correct:0,wrong:0,due:null},
 {id:6,word:"contribute",pos:"verb",meaning:"đóng góp",translation:"đóng góp",ipa:"/kənˈtrɪbjuːt/",example:"Regular reading can contribute to language development.",topic:"Education",level:"B1",source:"Sample",notes:"",status:"LEARNING",correct:2,wrong:0,due:null},
 {id:7,word:"significant",pos:"adjective",meaning:"đáng kể, quan trọng",translation:"đáng kể",ipa:"/sɪɡˈnɪfɪkənt/",example:"Technology has had a significant impact on communication.",topic:"Technology",level:"B2",source:"Sample",notes:"",status:"MASTERED",correct:5,wrong:0,due:null},
 {id:8,word:"tackle",pos:"verb",meaning:"giải quyết, xử lý",translation:"giải quyết",ipa:"/ˈtækl/",example:"Cities need effective policies to tackle traffic congestion.",topic:"Cities",level:"B2",source:"Sample",notes:"",status:"NEW",correct:0,wrong:0,due:null}
];
const STORE="happyforlearn.v1", OLD_STORE="lexiielts.v1";
let state=loadState(), page="dashboard", vocabFilter="ALL", vocabQuery="", flashQueue=[], flashIndex=0, flashRevealed=false, practiceSkill="Listening", practiceItems=[], practiceIndex=0, practiceScore=0, practiceAnswered=false, importRows=[];
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(OLD_STORE));if(s&&Array.isArray(s.words))return s}catch(e){}return {words:SEED.map(x=>({...x})),sessions:[],lastStudy:null}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML="",2600)}
function wordStatus(w){if(w.status==="MASTERED")return '<span class="pill green">Đã ghi nhớ</span>';if(w.status==="LEARNING")return '<span class="pill orange">Đang học</span>';if(w.status==="REVIEW")return '<span class="pill red">Cần ôn</span>';return '<span class="pill">Từ mới</span>'}
function go(p){page=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){vocabQuery=e.target.value;go("vocabulary")}});
function stats(){const w=state.words;return {total:w.length,new:w.filter(x=>x.status==="NEW").length,learning:w.filter(x=>x.status==="LEARNING").length,mastered:w.filter(x=>x.status==="MASTERED").length,due:w.filter(x=>x.status==="REVIEW"||(x.due&&new Date(x.due)<=new Date())).length,attempts:state.sessions.length,accuracy:state.sessions.reduce((a,s)=>a+s.correct,0)/(state.sessions.reduce((a,s)=>a+s.total,0)||1)*100}}
function head(title,sub,actions=""){return `<div class="pagehead"><div><div class="eyebrow">HAPPY FOR LEARN VOCABULARY STUDIO</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="toolbar">${actions}</div></div>`}
function statCard(label,num,icon,desc=""){return `<div class="card"><div class="stat"><div><div class="label">${label}</div><div class="num">${num}</div><div class="small muted">${desc}</div></div><div class="iconbox">${icon}</div></div></div>`}
function render(){const app=document.getElementById("app");if(page==="dashboard")app.innerHTML=dashboard();else if(page==="vocabulary")app.innerHTML=vocabularyPage();else if(page==="learn")app.innerHTML=learnPage();else if(page==="practice")app.innerHTML=practicePage();else if(page==="import")app.innerHTML=importPage();wirePage()}
function dashboard(){const s=stats(),percent=Math.round(s.accuracy);const skills=[["Listening","🎧",Math.min(100,Math.round(percent*.9))],["Speaking","🎙️",Math.min(100,Math.round(percent*.65))],["Reading","📖",Math.min(100,Math.round(percent*1.05))],["Writing","✍️",Math.min(100,Math.round(percent*.75))]];return `${head("Chào bạn! 👋","Mỗi từ mới là một bước gần hơn tới mục tiêu IELTS của bạn.",'<button class="primary" data-action="start-learn">✦ Bắt đầu học</button>')}
<div class="grid stats">${statCard("Tổng từ vựng",s.total,"▤","Trong thư viện")}${statCard("Từ mới",s.new,"✧","Chưa bắt đầu học")}${statCard("Cần ôn tập",s.due,"↻","Ôn để nhớ lâu hơn")}${statCard("Đã ghi nhớ",s.mastered,"✓","Theo tiêu chí ứng dụng")}</div>
<div class="grid dashgrid"><div class="card"><div class="cardhead"><h2>Tiến độ học tập</h2><span class="pill">Tổng quan</span></div><p class="muted small">Tỷ lệ chính xác từ các câu trả lời đã lưu: <strong>${percent}%</strong></p><div class="progress"><span style="width:${percent}%"></span></div><div style="margin-top:24px"><div class="cardhead"><h2>Thực hành 4 kỹ năng</h2><span class="muted small">MVP</span></div>${skills.map(x=>`<div class="skillrow"><span>${x[1]} ${x[0]}</span><div class="progress"><span style="width:${x[2]}%"></span></div><strong>${x[2]}%</strong></div>`).join("")}<p class="footer-note">Chỉ số kỹ năng hiện là chỉ báo minh họa dựa trên hoạt động học chung, chưa phải điểm đánh giá IELTS riêng cho từng kỹ năng.</p></div></div>
<div class="grid" style="gap:16px"><div class="card streak"><div class="small muted">HÔM NAY</div><div class="big">Học một chút, tiến bộ mỗi ngày</div><p class="muted">Hãy ôn những từ khó trước rồi học từ mới.</p><button style="background:white;color:#5a55d6" data-action="review">Ôn tập ngay →</button></div><div class="card"><div class="cardhead"><h2>Học gần đây</h2><button class="ghost" data-action="go-vocab">Xem tất cả</button></div>${state.words.slice(-4).reverse().map(w=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)"><div><div class="word">${esc(w.word)}</div><div class="small muted">${esc(w.meaning||"Chưa thêm nghĩa")}</div></div>${wordStatus(w)}</div>`).join("")}</div></div></div>`}
function vocabularyPage(){let words=state.words.filter(w=>(vocabFilter==="ALL"||w.status===vocabFilter)&&(`${w.word} ${w.meaning} ${w.topic} ${w.notes}`).toLowerCase().includes(vocabQuery.toLowerCase()));return `${head("Thư viện từ vựng","Quản lý từ, nghĩa, ví dụ và trạng thái ghi nhớ.",'<button class="secondary" data-action="go-import">⇧ Import CSV</button><button class="primary" data-action="add-word">＋ Thêm từ</button>')}
<div class="card"><div class="toolbar" style="margin-bottom:16px"><input id="vocabSearch" placeholder="Tìm từ, nghĩa, chủ đề..." value="${esc(vocabQuery)}"/><select id="statusFilter"><option value="ALL">Tất cả trạng thái</option><option value="NEW">Từ mới</option><option value="LEARNING">Đang học</option><option value="REVIEW">Cần ôn</option><option value="MASTERED">Đã ghi nhớ</option></select><span class="muted small">${words.length} từ</span></div><div class="tablewrap"><table><thead><tr><th>Từ / Cụm từ</th><th>Nghĩa</th><th>Chủ đề</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${words.length?words.map(w=>`<tr><td><div class="word">${esc(w.word)}</div><div class="small muted">${esc(w.ipa||w.pos||"")}</div></td><td><div>${esc(w.meaning||w.translation||"—")}</div><div class="meaning small">${esc(w.example||"")}</div></td><td>${esc(w.topic||"General")}</td><td>${wordStatus(w)}</td><td><div class="rowactions"><button class="secondary" data-action="edit-word" data-id="${w.id}">Sửa</button><button class="ghost" data-action="study-one" data-id="${w.id}">Học</button><button class="danger" data-action="delete-word" data-id="${w.id}">×</button></div></td></tr>`).join(""):`<tr><td colspan="5"><div class="empty"><div class="emoji">📚</div><strong>Chưa tìm thấy từ vựng</strong><p>Thêm từ mới hoặc thay đổi bộ lọc.</p></div></td></tr>`}</tbody></table></div></div>`}
function learnPage(){if(!flashQueue.length){return `${head("Flashcards","Lật thẻ, tự kiểm tra trí nhớ và lên lịch ôn tập.",'<button class="secondary" data-action="review">↻ Ôn từ cần nhớ</button>')}<div class="card flash-wrap"><div class="empty"><div class="emoji">✦</div><h2>Chuẩn bị một phiên học</h2><p>Học từ mới hoặc ôn lại các từ đã lưu.</p><button class="primary" data-action="start-learn">Bắt đầu học ${state.words.length} từ →</button></div></div>`}
const w=flashQueue[flashIndex];return `${head("Flashcards","Chủ động nhớ lại nghĩa trước khi lật thẻ.",'<button class="ghost" data-action="end-flash">Kết thúc phiên</button>')}<div class="flash-wrap"><div style="display:flex;justify-content:space-between;margin:0 4px 10px" class="small muted"><span>Thẻ ${flashIndex+1}/${flashQueue.length}</span><span>${Math.round((flashIndex+1)/flashQueue.length*100)}% hoàn thành</span></div><div class="progress" style="margin-bottom:16px"><span style="width:${(flashIndex+1)/flashQueue.length*100}%"></span></div><div class="flashcard" id="flashcard" role="button" tabindex="0"><span class="pill">${esc(w.topic||"IELTS Vocabulary")}</span><div class="flash-word">${esc(w.word)}</div><div class="muted">${esc(w.ipa||"")} ${w.pos?"· "+esc(w.pos):""}</div>${flashRevealed?`<div class="flash-meaning">${esc(w.meaning||w.translation||"Chưa có nghĩa — hãy bổ sung trong thư viện")}</div><div class="flash-example">${esc(w.example||"Chưa có ví dụ")}</div>${w.notes?`<p class="small muted">Ghi chú: ${esc(w.notes)}</p>`:""}`:'<p class="muted">Bạn nhớ nghĩa của từ này không?</p><span class="pill">Nhấn để xem đáp án</span>'}</div><div class="flash-controls">${flashRevealed?'<button class="danger" data-action="rate" data-rate="again">Chưa nhớ</button><button class="ghost" data-action="rate" data-rate="hard">Khó nhớ</button><button class="primary" data-action="rate" data-rate="good">Đã nhớ ✓</button>':'<button class="primary" data-action="reveal">Hiện đáp án</button>'}</div><p class="footer-note" style="text-align:center">Tự đánh giá trung thực giúp lịch ôn tập hữu ích hơn.</p></div>`}
function practicePage(){return `${head("Luyện tập 4 kỹ năng","Luyện cách nhận biết và sử dụng từ vựng trong ngữ cảnh.")}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px">${[
["Listening","🎧","Nghe và nhận diện từ","Nghe phát âm, chọn từ hoặc hoàn thành câu."],["Speaking","🎙️","Tự đặt câu với từ mới","Gợi ý câu hỏi và lưu câu trả lời của bạn."],["Reading","📖","Đoán nghĩa theo ngữ cảnh","Đọc câu và chọn nghĩa phù hợp."],["Writing","✍️","Dùng từ trong câu viết","Viết câu của riêng bạn và xem ví dụ tham khảo."]
].map((x,i)=>`<div class="card skill-card"><div class="skill-icon">${x[1]}</div><div><h3>${x[0]}</h3><p>${x[2]}<br>${x[3]}</p><button class="secondary" data-action="practice-skill" data-skill="${x[0]}">Bắt đầu →</button></div></div>`).join("")}</div><div id="practiceArea" style="margin-top:18px"></div><div class="notice">Lưu ý: các hoạt động này hỗ trợ học từ vựng, không phải bài thi IELTS chính thức và không tự động ước tính band điểm.</div>`}
function importPage(){return `${head("Import từ vựng","Nhập hàng loạt từ file CSV UTF-8.",'<button class="secondary" data-action="download-template">Tải template CSV</button>')}<div class="grid dashgrid"><div class="card"><div class="cardhead"><h2>1. Chọn file CSV</h2></div><p class="muted small">Các cột được hỗ trợ: word, meaning, translation, pos, ipa, example, topic, level, notes. Bắt buộc có cột word.</p><div class="field"><label>Chọn file</label><input id="csvFile" type="file" accept=".csv,text/csv"/></div><div class="field"><label>Import vào</label><select id="importMode"><option value="merge">Thêm từ mới, bỏ qua từ trùng</option><option value="update">Cập nhật từ trùng</option></select></div><button class="primary" data-action="parse-csv">Đọc và xem trước</button><div id="importMessage"></div></div><div class="card"><h2>Hướng dẫn</h2><ol class="muted small" style="padding-left:18px;line-height:2"><li>Tải template CSV nếu chưa có file.</li><li>Điền từ vựng và thông tin bạn có.</li><li>Lưu file ở định dạng CSV UTF-8.</li><li>Chọn file, xem trước và xác nhận import.</li></ol><div class="notice">Dữ liệu của bản demo được lưu trong trình duyệt hiện tại. Hãy xuất/backup dữ liệu trước khi xóa dữ liệu trình duyệt.</div></div></div><div id="importPreview" style="margin-top:18px"></div>`}
function wirePage(){const vs=document.getElementById("vocabSearch");if(vs)vs.addEventListener("input",e=>{vocabQuery=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById("vocabSearch");el.focus();el.setSelectionRange(pos,pos)});const sf=document.getElementById("statusFilter");if(sf){sf.value=vocabFilter;sf.addEventListener("change",e=>{vocabFilter=e.target.value;render()})}}
document.addEventListener("click",e=>{const a=e.target.closest("[data-action]");if(!a)return;const act=a.dataset.action,id=Number(a.dataset.id);if(act==="add-word")openWordModal();if(act==="edit-word")openWordModal(state.words.find(w=>w.id===id));if(act==="delete-word")deleteWord(id);if(act==="study-one"){const w=state.words.find(x=>x.id===id);flashQueue=[w];flashIndex=0;flashRevealed=false;go("learn")}if(act==="start-learn")startFlash(false);if(act==="review")startFlash(true);if(act==="go-vocab")go("vocabulary");if(act==="go-import")go("import");if(act==="reveal"){flashRevealed=true;render()}if(act==="rate")rateCard(a.dataset.rate);if(act==="end-flash"){flashQueue=[];save();go("dashboard")}if(act==="parse-csv")parseCSV();if(act==="download-template")downloadTemplate();if(act==="confirm-import")confirmImport();if(act==="practice-skill")startPractice(a.dataset.skill);if(act==="practice-answer")answerPractice(Number(a.dataset.index));if(act==="next-question")nextQuestion();if(act==="save-sentence")saveSentence();if(act==="dictionary-search")searchDictionary();if(act==="speak-word")speakWord(a.dataset.word)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(page==="learn"&&e.code==="Space"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();if(!flashRevealed){flashRevealed=true;render()}}});
function openWordModal(w={}){const edit=!!w.id;document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="modalhead"><h2>${edit?"Chỉnh sửa từ vựng":"Thêm từ vựng"}</h2><button class="ghost" data-action="close-modal">✕</button></div><form id="wordForm"><div class="formgrid"><div class="field"><label>Từ / cụm từ *</label><input name="word" required value="${esc(w.word||"")}" placeholder="e.g. sustainable"/></div><div class="field"><label>Loại từ</label><input name="pos" value="${esc(w.pos||"")}" placeholder="noun / verb / adjective"/></div><div class="field"><label>Nghĩa tiếng Việt</label><input name="meaning" value="${esc(w.meaning||"")}" placeholder="bền vững"/></div><div class="field"><label>Phiên âm IPA</label><input name="ipa" value="${esc(w.ipa||"")}" placeholder="/səˈsteɪnəbl/"/></div><div class="field"><label>Chủ đề IELTS</label><input name="topic" value="${esc(w.topic||"")}" placeholder="Environment"/></div><div class="field"><label>Trình độ</label><select name="level"><option ${w.level==="A2"?"selected":""}>A2</option><option ${w.level==="B1"?"selected":""}>B1</option><option ${w.level==="B2"?"selected":""}>B2</option><option ${w.level==="C1"?"selected":""}>C1</option><option ${w.level==="C2"?"selected":""}>C2</option></select></div><div class="field span2"><label>Ví dụ tiếng Anh</label><textarea name="example" rows="2" placeholder="Write an example sentence...">${esc(w.example||"")}</textarea></div><div class="field span2"><label>Ghi chú cá nhân</label><textarea name="notes" rows="2">${esc(w.notes||"")}</textarea></div></div><div class="modalfoot"><button type="button" class="ghost" data-action="close-modal">Hủy</button><button class="primary" type="submit">Lưu từ vựng</button></div></form></div></div>`;document.getElementById("backdrop").addEventListener("click",e=>{if(e.target.id==="backdrop")closeModal()});document.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.onclick=closeModal);document.getElementById("wordForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f.entries());const word=data.word.trim();if(!word)return;const existing=state.words.find(x=>x.word.toLowerCase()===word.toLowerCase()&&x.id!==w.id);if(existing&&!edit){toast("Từ đã tồn tại trong thư viện.");return}if(edit){Object.assign(w,data,{word,updatedAt:new Date().toISOString()})}else{state.words.push({id:Date.now(),...data,word,translation:data.meaning,source:"MANUAL",status:"NEW",correct:0,wrong:0,due:null})}save();closeModal();render();toast(edit?"Đã cập nhật từ vựng":"Đã thêm từ vựng")}}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function deleteWord(id){const w=state.words.find(x=>x.id===id);if(!w)return;if(confirm(`Xóa từ "${w.word}" khỏi thư viện?`)){state.words=state.words.filter(x=>x.id!==id);save();render();toast("Đã xóa từ vựng")}}
function startFlash(review){flashQueue=state.words.filter(w=>review?(w.status==="REVIEW"||(w.due&&new Date(w.due)<=new Date())):true).sort((a,b)=>{if(review)return (a.due||"").localeCompare(b.due||"");return (a.status==="NEW"?-1:1)-(b.status==="NEW"?-1:1)}).slice(0,20);if(!flashQueue.length){toast(review?"Bạn không có từ đến hạn ôn.":"Chưa có từ vựng.");return}flashIndex=0;flashRevealed=false;go("learn")}
function rateCard(rate){const w=flashQueue[flashIndex];if(!w)return;const now=new Date();if(rate==="again"){w.wrong=(w.wrong||0)+1;w.status="REVIEW";w.due=new Date(now.getTime()+10*60*1000).toISOString()}else if(rate==="hard"){w.correct=(w.correct||0)+1;w.status="LEARNING";w.due=new Date(now.getTime()+24*60*60*1000).toISOString()}else{w.correct=(w.correct||0)+1;w.status=(w.correct>=3&&w.wrong===0)?"MASTERED":"LEARNING";w.due=new Date(now.getTime()+(w.status==="MASTERED"?7:2)*24*60*60*1000).toISOString()}if(flashIndex===flashQueue.length-1){state.sessions.push({date:now.toISOString(),type:"flashcards",skill:null,total:flashQueue.length,correct:flashQueue.filter(x=>x.status!=="REVIEW").length});state.lastStudy=now.toISOString();save();flashQueue=[];go("dashboard");toast("Hoàn thành phiên flashcard!")}else{flashIndex++;flashRevealed=false;save();render()}}
function parseCSV(){const input=document.getElementById("csvFile"),msg=document.getElementById("importMessage"),preview=document.getElementById("importPreview");if(!input.files.length){msg.innerHTML='<div class="notice error">Vui lòng chọn file CSV.</div>';return}const file=input.files[0];if(file.size>5*1024*1024){msg.innerHTML='<div class="notice error">File vượt quá 5 MB.</div>';return}const reader=new FileReader();reader.onload=()=>{try{importRows=parseCSVText(reader.result);if(!importRows.length)throw Error("Không có dòng dữ liệu.");const invalid=importRows.filter(r=>!r.word||!r.word.trim()).length;msg.innerHTML=`<div class="notice ${invalid?"error":"success"}">Đã đọc ${importRows.length} dòng. ${invalid?invalid+" dòng thiếu word.": "Hãy kiểm tra dữ liệu trước khi import."}</div>`;preview.innerHTML=`<div class="card"><div class="cardhead"><h2>2. Xem trước dữ liệu</h2><span class="pill">${importRows.length} dòng</span></div><div class="tablewrap"><table><thead><tr><th>Word</th><th>Meaning</th><th>Topic</th><th>Validation</th></tr></thead><tbody>${importRows.slice(0,12).map(r=>`<tr><td>${esc(r.word||"")}</td><td>${esc(r.meaning||r.translation||"")}</td><td>${esc(r.topic||"")}</td><td>${r.word?.trim()?'<span class="pill green">Hợp lệ</span>':'<span class="pill red">Thiếu word</span>'}</td></tr>`).join("")}</tbody></table></div>${importRows.length>12?`<p class="small muted">Chỉ hiển thị 12 dòng đầu tiên.</p>`:""}<div class="modalfoot"><button class="primary" data-action="confirm-import">Xác nhận import</button></div></div>`}catch(err){msg.innerHTML=`<div class="notice error">${esc(err.message||"Không đọc được CSV.")}</div>`;preview.innerHTML=""}};reader.readAsText(file,"UTF-8")}
function parseCSVText(text){const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];function parseLine(line){let out=[],v="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&q&&line[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===","&&!q){out.push(v.trim());v=""}else v+=c}out.push(v.trim());return out}const headers=parseLine(lines.shift()).map(x=>x.toLowerCase().trim().replace(/\s+/g,"_"));return lines.map(line=>{const cells=parseLine(line),o={};headers.forEach((h,i)=>o[h]=cells[i]||"");return {word:o.word||o.vocabulary||o.term||"",meaning:o.meaning||o.definition||"",translation:o.translation||"",pos:o.pos||o.part_of_speech||"",ipa:o.ipa||o.pronunciation||"",example:o.example||o.example_sentence||"",topic:o.topic||o.category||"General",level:o.level||"",notes:o.notes||""}})}
function confirmImport(){const mode=document.getElementById("importMode")?.value||"merge";let added=0,updated=0,skipped=0,invalid=0;for(const r of importRows){if(!r.word?.trim()){invalid++;continue}let old=state.words.find(w=>w.word.toLowerCase()===r.word.trim().toLowerCase());if(old){if(mode==="update"){Object.assign(old,Object.fromEntries(Object.entries(r).filter(([k,v])=>v!==""&&k!=="word")),{word:r.word.trim()});updated++}else skipped++;continue}state.words.push({id:Date.now()+Math.random(),...r,word:r.word.trim(),source:"IMPORT",status:"NEW",correct:0,wrong:0,due:null});added++}save();document.getElementById("importPreview").innerHTML=`<div class="card"><h2>Import hoàn tất</h2><div class="grid stats" style="margin-top:15px">${statCard("Đã thêm",added,"✓")}${statCard("Đã cập nhật",updated,"↻")}${statCard("Bỏ qua",skipped,"−")}${statCard("Dòng lỗi",invalid,"!")}</div><button class="primary" data-action="go-vocab">Mở thư viện từ vựng</button></div>`;document.getElementById("importMessage").innerHTML='<div class="notice success">Dữ liệu đã được lưu trong trình duyệt.</div>';importRows=[];toast("Import hoàn tất")}
function downloadTemplate(){const content="word,meaning,translation,pos,ipa,example,topic,level,notes\r\nsustainable,bền vững,bền vững,adjective,/səˈsteɪnəbl/,We need sustainable solutions.,Environment,B2,Example note\r\nmitigate,làm giảm,giảm thiểu,verb,/ˈmɪtɪɡeɪt/,Policies can mitigate the risk.,Environment,C1,";const blob=new Blob(["\uFEFF"+content],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="ielts-vocabulary-template.csv";a.click();URL.revokeObjectURL(url)}
function startPractice(skill){practiceSkill=skill;practiceIndex=0;practiceScore=0;practiceAnswered=false;practiceItems=[...state.words].sort(()=>Math.random()-.5).slice(0,Math.min(8,state.words.length));if(!practiceItems.length){toast("Hãy thêm từ vựng trước.");return}const area=document.getElementById("practiceArea");area.innerHTML=`<div class="card"><div class="cardhead"><h2>${skill==="Listening"?"🎧":skill==="Speaking"?"🎙️":skill==="Reading"?"📖":"✍️"} ${skill} practice</h2><button class="ghost" data-action="end-flash">Đóng</button></div><div id="practiceContent"></div></div>`;renderQuestion()}
function renderQuestion(){const root=document.getElementById("practiceContent");if(!root)return;if(practiceIndex>=practiceItems.length){state.sessions.push({date:new Date().toISOString(),type:"practice",skill:practiceSkill,total:practiceItems.length,correct:practiceScore});save();root.innerHTML=`<div class="resultbox"><h2>Hoàn thành!</h2><p>Bạn trả lời đúng <strong>${practiceScore}/${practiceItems.length}</strong> câu trong hoạt động ${practiceSkill}.</p><button class="primary" data-action="practice-skill" data-skill="${practiceSkill}">Làm lại</button></div>`;return}const w=practiceItems[practiceIndex];if(practiceSkill==="Speaking"||practiceSkill==="Writing"){root.innerHTML=`<div class="small muted">Câu ${practiceIndex+1}/${practiceItems.length}</div><div class="question">${practiceSkill==="Speaking"?"Hãy nói một câu với từ:":"Hãy viết một câu sử dụng từ:"} <span style="color:var(--brand)">${esc(w.word)}</span></div><p class="muted">${esc(w.meaning||"")}</p><textarea id="userSentence" rows="3" placeholder="Write your own sentence in English..."></textarea><div class="resultbox"><strong>Ví dụ tham khảo</strong><p>${esc(w.example||"Chưa có ví dụ. Hãy bổ sung trong thư viện.")}</p></div><div class="modalfoot"><button class="primary" data-action="save-sentence">Lưu câu & tiếp tục</button></div>`;if(practiceSkill==="Speaking"){const btn=document.createElement("button");btn.className="secondary";btn.textContent="🔊 Nghe cách phát âm";btn.style.marginTop="10px";btn.onclick=()=>speakWord(w.word);root.insertBefore(btn,root.querySelector(".resultbox"))}return}
let prompt="",options=[];if(practiceSkill==="Listening"){prompt="Nghe phát âm và chọn từ đúng";options=makeOptions(w,"word");}else if(practiceSkill==="Reading"){prompt=`Trong ngữ cảnh sau, nghĩa phù hợp nhất của “${w.word}” là gì?`;options=makeOptions(w,"meaning")}else{prompt=`Chọn nghĩa phù hợp với “${w.word}”`;options=makeOptions(w,"meaning")}
root.innerHTML=`<div class="small muted">Câu ${practiceIndex+1}/${practiceItems.length}</div><div class="question">${esc(prompt)}</div>${practiceSkill==="Listening"?`<button class="secondary" data-action="speak-word" data-word="${esc(w.word)}">🔊 Phát âm</button>`:""}${practiceSkill==="Reading"&&w.example?`<blockquote>${esc(w.example)}</blockquote>`:""}<div class="options" style="margin-top:14px">${options.map((o,i)=>`<button data-action="practice-answer" data-index="${i}" data-value="${esc(o.value)}">${esc(o.label)}</button>`).join("")}</div><div id="answerFeedback"></div>`}
function makeOptions(w,field){const correct=w[field]||w.meaning||w.word;const others=state.words.filter(x=>x.id!==w.id).map(x=>x[field]||x.meaning||x.word).filter(Boolean);const unique=[...new Set(others)].sort(()=>Math.random()-.5).slice(0,3);return [...unique,correct].sort(()=>Math.random()-.5).map(x=>({value:x,label:x}))}
function answerPractice(index){if(practiceAnswered)return;const w=practiceItems[practiceIndex],buttons=[...document.querySelectorAll('[data-action="practice-answer"]')],picked=buttons[index]?.dataset.value,correct=practiceSkill==="Listening"?w.word:(w.meaning||w.translation||w.word);practiceAnswered=true;const isCorrect=picked===correct;if(isCorrect)practiceScore++;buttons.forEach(b=>{b.disabled=true;if(b.dataset.value===correct)b.classList.add("correct");else if(b.dataset.value===picked)b.classList.add("wrong")});document.getElementById("answerFeedback").innerHTML=`<div class="resultbox"><strong>${isCorrect?"Chính xác! ✓":"Chưa đúng"}</strong><p>${esc(w.word)} — ${esc(w.meaning||w.translation||"")}</p><p class="small muted">${esc(w.example||"")}</p><button class="primary" data-action="next-question">Câu tiếp theo →</button></div>`;w.correct=(w.correct||0)+(isCorrect?1:0);w.wrong=(w.wrong||0)+(isCorrect?0:1);if(!isCorrect)w.status="REVIEW";else if(w.correct>=3&&w.wrong===0)w.status="MASTERED";else w.status="LEARNING";save()}
function nextQuestion(){practiceIndex++;practiceAnswered=false;renderQuestion()}
function saveSentence(){const text=document.getElementById("userSentence")?.value.trim();if(!text){toast("Hãy nhập câu của bạn trước.");return}const w=practiceItems[practiceIndex];w.notes=(w.notes? w.notes+"\n":"")+`[${practiceSkill}] ${text}`;w.status="LEARNING";save();practiceIndex++;renderQuestion();toast("Đã lưu câu vào ghi chú của từ")}
async function searchDictionary(){const input=document.getElementById("dictWord"),out=document.getElementById("dictResult");const q=input.value.trim();if(!q)return;out.innerHTML='<div class="notice">Đang tra cứu…</div>';try{const res=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(q));if(!res.ok)throw Error("Không tìm thấy từ hoặc dịch vụ chưa phản hồi.");const data=await res.json(),d=data[0],meaning=d.meanings?.[0],def=meaning?.definitions?.[0];out.innerHTML=`<div class="resultbox"><h2>${esc(d.word)}</h2><p class="muted">${esc(d.phonetic||"")} · ${esc(meaning?.partOfSpeech||"")}</p><p>${esc(def?.definition||"Chưa có định nghĩa")}</p><p class="muted">${esc(def?.example||"")}</p><button class="primary" id="saveDict">Lưu vào thư viện</button></div>`;document.getElementById("saveDict").onclick=()=>{if(state.words.some(w=>w.word.toLowerCase()===d.word.toLowerCase())){toast("Từ đã có trong thư viện.");return}state.words.push({id:Date.now(),word:d.word,pos:meaning?.partOfSpeech||"",meaning:def?.definition||"",translation:"",ipa:d.phonetic||"",example:def?.example||"",topic:"Dictionary",source:"Dictionary API",status:"NEW",correct:0,wrong:0,due:null,notes:""});save();toast("Đã lưu từ tra cứu");}}catch(err){out.innerHTML=`<div class="notice error">${esc(err.message)} Bạn vẫn có thể thêm từ thủ công hoặc import CSV.</div>`}}
function speakWord(word){if(!("speechSynthesis"in window)){toast("Trình duyệt không hỗ trợ phát âm.");return}const u=new SpeechSynthesisUtterance(word);u.lang="en-GB";u.rate=.82;speechSynthesis.speak(u)}
// Dictionary panel is available from vocabulary page without relying on an Oxford API.
const oldVocabularyPage=vocabularyPage;
vocabularyPage=function(){return oldVocabularyPage()+`<div class="card" style="margin-top:16px"><div class="cardhead"><h2>Tra cứu từ điển tiếng Anh</h2><span class="pill">Nguồn demo</span></div><p class="muted small">Tra cứu thử qua Free Dictionary API. Đây không phải dữ liệu Oxford; cần tích hợp API Oxford được cấp phép nếu muốn dùng Oxford chính thức.</p><div class="toolbar"><input id="dictWord" placeholder="Nhập từ tiếng Anh, ví dụ: resilience"/><button class="primary" data-action="dictionary-search">Tra cứu</button></div><div id="dictResult"></div></div>`}
render();
</script>
